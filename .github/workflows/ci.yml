name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Backend and frontend checks
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Validate backend configuration
        run: |
          python -m compileall -q server
          python server/manage.py check
          python server/manage.py makemigrations --check --dry-run

      - name: Run backend tests and migrations
        run: |
          python server/manage.py migrate --noinput
          python server/manage.py test

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: server/frontend
        run: npm test

      - name: Build frontend
        working-directory: server/frontend
        run: npm run build

      - name: Check production Django settings and static collection
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-check-secret-placeholder-do-not-use-in-a-real-deployment-2026-10-26
          DJANGO_ALLOWED_HOSTS: capstone.example.invalid
          DJANGO_CSRF_TRUSTED_ORIGINS: https://capstone.example.invalid
        run: |
          python server/manage.py check --deploy
          python server/manage.py collectstatic --noinput --clear

  deployment-gate:
    name: Check for an owner-configured deploy hook
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        shell: bash
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Deployment hook is configured."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped: configure the DEPLOY_WEBHOOK_URL secret and provider target."
          fi

  deploy:
    name: Deploy through the configured provider hook
    needs: [checks, deployment-gate]
    if: github.event_name == 'workflow_dispatch' && needs.deployment-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: curl --fail --silent --show-error --output /dev/null --retry 2 --request POST "$DEPLOY_WEBHOOK_URL"
